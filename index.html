:root {
--ink-0: #070c16;
--ink-1: #0d1828;
--ink-2: #15243b;
--ink-3: #203454;
--paper: #f2e9d6;
--paper-2: #e3d4b8;
--card-ink: #17243a;
--brass: #cda862;
--brass-deep: #8f6b2c;
--thread: #d8473a;
--text: #efe8db;
--muted: #a7b1c2;
--display: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
--mono: 'Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
--ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
--paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .26 0 0 0 0 .12 0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
color-scheme: dark;
}
*,
*::before,
*::after {
box-sizing: border-box;
}
html,
body {
height: 100%;
margin: 0;
background: var(--ink-1);
color: var(--text);
}
body {
font-family: var(--display);
font-size: 18px;
line-height: 1.45;
font-optical-sizing: auto;
-webkit-font-smoothing: antialiased;
-webkit-tap-highlight-color: transparent;
overflow-x: hidden;
text-rendering: optimizeLegibility;
}
body::before {
content: '';
position: fixed;
inset: 0;
pointer-events: none;
background:
radial-gradient(ellipse 90% 60% at 50% -12%, rgba(214, 176, 104, 0.2), rgba(214, 176, 104, 0) 70%),
radial-gradient(ellipse 140% 90% at 50% 130%, rgba(3, 6, 12, 0.9), rgba(3, 6, 12, 0) 60%);
}
body::after {
content: '';
position: fixed;
inset: 0;
pointer-events: none;
opacity: 0.55;
background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .78 0 0 0 0 .7 0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#app {
position: relative;
z-index: 1;
height: 100%;
}
button {
font: inherit;
color: inherit;
}
:focus-visible {
outline: 2px solid var(--brass);
outline-offset: 3px;
}
.sr {
position: absolute !important;
width: 1px;
height: 1px;
overflow: hidden;
clip: rect(0 0 0 0);
clip-path: inset(50%);
white-space: nowrap;
}
.eyebrow {
margin: 0;
font: 500 12px/1.3 var(--mono);
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--brass);
}
.eyebrow svg {
fill: currentColor;
vertical-align: -2px;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
min-height: 50px;
padding: 12px 22px;
border: 1px solid;
border-radius: 2px;
font: 600 17px/1.2 var(--display);
text-decoration: none;
cursor: pointer;
transition:
background-color 0.15s,
border-color 0.15s,
transform 0.15s,
box-shadow 0.15s;
}
.btn:active {
transform: translateY(1px);
}
.btn.primary {
background: var(--paper);
color: var(--card-ink);
border-color: var(--paper);
box-shadow:
inset 0 1px 0 rgba(255, 255, 255, 0.6),
0 10px 26px -12px rgba(0, 0, 0, 0.8);
}
.btn.primary:hover {
background: #fff7e6;
}
.btn.ghost {
background: transparent;
color: var(--text);
border-color: rgba(205, 168, 98, 0.5);
}
.btn.ghost:hover {
border-color: var(--brass);
background: rgba(205, 168, 98, 0.08);
}
.btn.ink.primary {
background: var(--card-ink);
color: var(--paper);
border-color: var(--card-ink);
}
.btn.ink.ghost {
color: var(--card-ink);
border-color: rgba(23, 36, 58, 0.45);
}
.btn.ink.ghost:hover {
background: rgba(23, 36, 58, 0.06);
}
.btn-sub {
font: 500 12px var(--mono);
letter-spacing: 0.06em;
opacity: 0.7;
}
.textbtn {
min-height: 44px;
padding: 0 6px;
background: none;
border: 0;
color: var(--brass);
font: 500 16px var(--display);
text-decoration: underline;
text-decoration-thickness: 1px;
text-underline-offset: 4px;
cursor: pointer;
}
.textbtn:hover {
color: var(--paper);
}
.textbtn.ink {
color: var(--card-ink);
}
.textbtn:disabled {
opacity: 0.4;
cursor: default;
}
.home {
position: relative;
min-height: 100%;
max-width: 1120px;
margin: 0 auto;
padding: max(30px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
display: grid;
grid-template-columns: minmax(0, 1fr);
grid-template-areas: 'copy' 'fan' 'foot';
gap: 18px;
overflow: hidden;
}
.home-thread {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
pointer-events: none;
overflow: visible;
}
.home-thread path,
.rundown-thread path {
fill: none;
stroke: var(--thread);
stroke-width: 2.2;
stroke-linecap: round;
stroke-dasharray: 1;
stroke-dashoffset: 1;
animation: draw 2.6s 0.3s var(--ease-out) forwards;
}
.home-copy {
grid-area: copy;
position: relative;
transition:
opacity 0.45s,
transform 0.45s var(--ease-out);
}
.title {
margin: 18px 0 14px;
font: italic 500 clamp(80px, 25vw, 176px) / 0.88 var(--display);
letter-spacing: -0.04em;
color: var(--paper);
text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
animation: rise 1s 0.15s var(--ease-out) both;
}
.title .apos {
color: var(--thread);
}
.lead {
margin: 0 0 12px;
max-width: 31ch;
font-size: clamp(19px, 2.3vw, 23px);
line-height: 1.42;
text-wrap: pretty;
animation: rise 0.9s 0.35s var(--ease-out) both;
}
.hint {
display: flex;
align-items: baseline;
gap: 8px;
margin: 0;
color: var(--muted);
font-style: italic;
font-size: 17px;
animation: rise 0.9s 0.45s var(--ease-out) both;
}
.hint svg {
flex: none;
fill: var(--thread);
position: relative;
top: 2px;
}
.cta {
display: flex;
flex-wrap: wrap;
gap: 12px;
margin-top: 24px;
animation: rise 0.9s 0.55s var(--ease-out) both;
}
.home-tools {
display: flex;
align-items: center;
flex-wrap: wrap;
gap: 2px;
margin-top: 10px;
animation: rise 0.9s 0.65s var(--ease-out) both;
}
.home-tools .sep {
color: var(--muted);
}
.home-fan {
grid-area: fan;
position: relative;
height: clamp(210px, 58vw, 430px);
}
.home-fan .fan {
position: absolute;
left: 50%;
top: 50%;
width: clamp(118px, 30vw, 236px);
aspect-ratio: 5 / 7;
transform: translate(-50%, -50%) translateX(var(--x)) rotate(var(--r));
animation: fanIn 1s var(--d) var(--ease-out) both;
transition:
transform 0.6s var(--ease-out),
opacity 0.5s;
}
.home-fan .f1 {
--x: -58%;
--r: -13deg;
--d: 0.25s;
}
.home-fan .f3 {
--x: 58%;
--r: 13deg;
--d: 0.4s;
}
.home-fan .f2 {
--x: 0%;
--r: -1.5deg;
--d: 0.55s;
z-index: 2;
}
.home-fan .f2 > .card {
width: 100%;
height: 100%;
animation: float 6s 1.6s ease-in-out infinite;
}
.home.leaving .home-copy {
opacity: 0;
transform: translateY(-14px);
}
.home.leaving .home-fan .fan {
transform: translate(-50%, -50%) translateX(0) rotate(0deg) scale(0.92);
}
.home.leaving .home-fan .f1,
.home.leaving .home-fan .f3 {
opacity: 0;
}
.home-foot {
grid-area: foot;
align-self: end;
margin: 0;
max-width: 62ch;
font: 400 12px/1.55 var(--mono);
color: var(--muted);
}
.card.ace {
position: relative;
background: var(--paper) var(--paper-grain);
display: grid;
place-items: center;
container-type: inline-size;
}
.ace .ace-pip {
width: 34cqw;
height: 34cqw;
fill: var(--card-ink);
}
.ace-corner {
position: absolute;
display: flex;
flex-direction: column;
align-items: center;
font: 600 22px/1 var(--display);
font-size: 12cqw;
color: var(--card-ink);
}
.ace-corner svg {
width: 6cqw;
height: 6cqw;
fill: var(--card-ink);
margin-top: 2px;
}
.ace-corner.tl {
top: 7%;
left: 8%;
}
.ace-corner.br {
bottom: 7%;
right: 8%;
transform: rotate(180deg);
}
.ace-thread {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
overflow: visible;
}
.ace-thread path {
fill: none;
stroke: var(--thread);
stroke-width: 1.8;
stroke-linecap: round;
stroke-dasharray: 1;
stroke-dashoffset: 1;
animation: draw 1.8s 1.2s var(--ease-out) forwards;
}
.card {
border-radius: 5.5% / 4%;
overflow: hidden;
box-shadow:
inset 0 1px 0 rgba(255, 255, 255, 0.45),
0 22px 44px -22px rgba(0, 0, 0, 0.85),
0 2px 6px rgba(0, 0, 0, 0.35);
}
.card.back {
background: var(--ink-2);
}
.card.back svg {
display: block;
width: 100%;
height: 100%;
}
.card .frame,
.atout .frame {
position: absolute;

}
